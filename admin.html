<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 · 自动控制学习站</title>
  <style>
    :root { font-family: Inter, "Microsoft YaHei", sans-serif; color: #1d2529; background: #f4f2ed; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px clamp(18px, 5vw, 72px); background: #fff; border-bottom: 1px solid #d8d5ce; }
    header h1 { margin: 0; font-size: clamp(22px, 3vw, 32px); }
    header p { margin: 6px 0 0; color: #667176; }
    header a, button { border: 1px solid #c9ced0; border-radius: 3px; padding: 10px 14px; background: #fff; color: #176b65; font: inherit; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: .55; cursor: wait; }
    main { width: min(1280px, calc(100% - 36px)); margin: 28px auto 60px; }
    .message { min-height: 1.5em; color: #a33b32; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
    .stat, .panel { background: #fff; border: 1px solid #d8d5ce; }
    .stat { padding: 18px; }
    .stat strong { display: block; font-size: 30px; color: #176b65; }
    .stat span { color: #667176; font-size: 13px; }
    .panel { padding: 20px; margin-top: 18px; overflow: hidden; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .panel-heading h2 { margin: 0; font-size: 19px; }
    .panel-heading p { margin: 5px 0 0; color: #667176; font-size: 13px; }
    .form-row { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-bottom: 14px; }
    label { display: grid; gap: 6px; color: #667176; font-size: 13px; }
    input { min-width: 130px; border: 1px solid #c9ced0; border-radius: 3px; padding: 10px; font: inherit; }
    .primary { background: #176b65; color: #fff; border-color: #176b65; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { padding: 11px 10px; border-top: 1px solid #e5e2dc; text-align: left; font-size: 14px; white-space: nowrap; }
    th { color: #667176; font-size: 12px; font-weight: 600; }
    td code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
    .label-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .status { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 9px; font-size: 12px; }
    .status-available { color: #146c43; background: #e3f4e9; }
    .status-used { color: #667176; background: #eef0f1; }
    .status-expired { color: #a33b32; background: #fbe9e6; }
    .empty { color: #667176; text-align: center; }
    .user-search { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-bottom: 14px; }
    .user-search label { flex: 1 1 260px; }
    .user-search input { width: 100%; }
    .user-count { color: #667176; font-size: 13px; }
    .user-pagination { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; color: #667176; font-size: 13px; }
    .user-pagination-actions { display: flex; gap: 8px; }
    .generated-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; color: #667176; font-size: 13px; }
    .copy-status { color: #176b65; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f4f2ed; padding: 12px; margin: 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    @media (max-width: 960px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } header { align-items: flex-start; flex-direction: column; } main { width: min(100% - 24px, 1280px); margin-top: 16px; } .panel { padding: 14px; } .form-row label, .form-row input { width: 100%; } }
  </style>
</head>
<body>
  <header><div><h1>管理后台</h1><p>用户、题库与激活码管理</p></div><div><a href="/">返回学习站</a> <button id="logout" type="button">退出登录</button></div></header>
  <main>
    <div class="message" id="message" role="alert"></div>
    <section class="stats" aria-label="站点统计"><div class="stat"><strong id="user-total">--</strong><span>注册用户</span></div><div class="stat"><strong id="question-total">--</strong><span>云端 AI 题目</span></div><div class="stat"><strong id="code-available">--</strong><span>可用激活码</span></div><div class="stat"><strong id="code-used">--</strong><span>已使用激活码</span></div><div class="stat"><strong id="code-expired">--</strong><span>已过期激活码</span></div></section>
    <section class="panel"><div class="panel-heading"><h2>发放激活码</h2><button id="refresh" type="button">刷新数据</button></div><div class="form-row"><label>数量<input id="code-count" type="number" min="1" max="100" value="10"></label><label>有效天数<input id="code-days" type="number" min="0" max="3650" value="30"></label><label>批次标签<input id="code-label" maxlength="120" placeholder="例如 2026 秋季用户"></label><button class="primary" id="generate" type="button">生成激活码</button></div><div id="generated-wrap" hidden><div class="generated-toolbar"><span>本次生成的完整激活码</span><button id="copy-generated" type="button">复制全部</button><span class="copy-status" id="copy-status" role="status"></span></div><pre id="generated"></pre></div></section>
    <section class="panel"><div class="panel-heading"><h2>激活码状态</h2></div><div class="table-scroll"><table><thead><tr><th scope="col">ID</th><th scope="col">提示</th><th scope="col">批次</th><th scope="col">状态</th><th scope="col">过期时间</th><th scope="col">操作</th></tr></thead><tbody id="codes"></tbody></table></div></section>
    <section class="panel"><div class="panel-heading"><div><h2>用户管理</h2><p>仅显示账号运营信息，不显示密码或会话令牌。</p></div><span class="user-count" id="user-result-count"></span></div><div class="user-search"><label>搜索账号<input id="user-search" name="user-search" type="search" autocomplete="off" placeholder="输入用户名，留空显示全部"></label><button id="user-search-button" class="primary" type="button">搜索用户</button><button id="user-clear-button" type="button">清除</button></div><div class="table-scroll"><table><thead><tr><th scope="col">ID</th><th scope="col">账号</th><th scope="col">注册时间</th><th scope="col">激活码</th><th scope="col">批次</th><th scope="col">最近活跃</th><th scope="col">在线会话</th><th scope="col">操作</th></tr></thead><tbody id="users"></tbody></table></div><div class="user-pagination"><span id="user-page-status"></span><div class="user-pagination-actions"><button id="user-prev" type="button">上一页</button><button id="user-next" type="button">下一页</button></div></div></section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
