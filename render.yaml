services:
  - type: web
    name: automatic-control-exam-platform
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: QUESTION_BANK_ADMIN_TOKEN
        sync: false
      - key: ACTIVATION_ADMIN_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: REQUIRE_ACTIVATION
        value: "true"
